# Fast gate: lint, types, and the test tiers that do not need real repositories.
#
# WHY: this is `just check` split into named jobs so a failure says which claim broke
#      without anyone reading a log. The live tiers are deliberately absent -- they need
#      pinned submodules and a pack format that does not exist before the call-site census layer. See
#      scripts/verify/README.md.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_VERSION: "0.12.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-extras
      # No .mypy_cache caching. mypy 2.x defaults to a binary (fixed-format) cache;
      # a cache written by 1.x and read by 2.x produces confusing results. If caching
      # is added later the key must include the mypy version.
      - run: uv run mypy --strict src/ scripts/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.2.0
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run pytest tests/unit -x --timeout=60
      - run: uv run pytest tests/property -x --timeout=120

  phase0:
    # Separate job because the harness runs on a different interpreter. PyCG fails on
    # 3.11+ and the product needs >=3.12; one environment cannot hold both.
    # research/phase0/ENVIRONMENT.lock records the reproduction.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/phase0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src/
      - run: uv run pytest -x --timeout=120
