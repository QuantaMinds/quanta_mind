## Step 0 findings — PyCG, verified by direct execution, not assumed

The pre-registration names vanilla PyCG as the instrument "because it is the
crudest and therefore the conservative one". Three things had to be established
before that sentence was executable. All three were found by running it.

### Finding 1 — pycg 0.0.8 is broken on every interpreter. Use 0.0.7.

The 0.0.8 wheel installs the package directory as `PyCG/`, while its own
`PyCG/__main__.py` line 4 reads `from pycg import formats`. The import fails
immediately:

    ModuleNotFoundError: No module named 'pycg'

Reproduced identically on 3.12 and 3.11, so it is a packaging defect, not an
interpreter incompatibility. 0.0.8 was the last release before the project was
archived on 2023-11-26 (final commit message: "Archival message"), and the
commit before it was "Fix deprecation issues with pyproject file (#74)" -- the
packaging change that appears to have introduced this. Nobody caught it because
nothing was released afterwards.

    PINNED: pycg==0.0.7

### Finding 2 — 0.0.7 needs setuptools<81.

`pycg/formats/fasten.py:23` does `from pkg_resources import Requirement`.
setuptools removed pkg_resources in 81; with setuptools 83 installed the import
still fails. Pinned below the removal.

    PINNED: setuptools==80.10.2

### Finding 3 — PyCG's ceiling is Python 3.10. This is why the harness is standalone.

On 3.11 and 3.12, `install_hooks()` -> `_clear_caches()` ->
`importlib.invalidate_caches()` now triggers a lazy import of
`importlib.metadata`, which re-enters the import hook PyCG has just installed:

    pycg.machinery.imports.ImportManagerError: Can't add edge to a non existing node

Verified working: 3.10.20, 3.9.25, 3.8.20.
Verified failing:  3.11.15, 3.12.x.

The product targets >=3.12 for sys.monitoring (ARCHITECTURE.md section 4). One
environment cannot satisfy both, which is the second independent reason
research/phase0/ is a standalone uv project rather than a workspace member.

    PINNED: .python-version = 3.10

### Finding 4 — GitPython's clone timeout does not exist on Windows

`Repo.clone_from(..., kill_after_timeout=N)` raises on every call:

    Cmd('git') failed due to: '"kill_after_timeout" feature is not supported on Windows.'

Not a slow clone, not a network fault -- the feature is refused outright. Every clone
in the study therefore failed on this platform, and because `cloned()` raises
`CloneFailed` which callers treated as corpus attrition, the pipeline would have run to
completion and reported 100% attrition as a result rather than as a broken environment.

The hand-labelling sheet is where it surfaced, and it surfaced badly: 13 of 13 clones
failed, the sheet rendered 20 PRs as having no commits in their window, and a labeller
reading it would have marked 20 clean. The outcome classifier returns CLEAN on
unreadable history for its own (defensible) reasons, so the `PHASE0_PREREGISTRATION.md` “Timeline” gate would have reported
20/20 PASS on no data whatsoever.

Fixed by calling git through `subprocess.run(..., timeout=CLONE_TIMEOUT_S)`, which is
portable and keeps the timeout AGENTS.md requires on every subprocess. Dropping the flag
would have "fixed" it by removing the timeout.

The second half of the fix is typed: `handlabel/window.py` returns a `Window` carrying
`available`, so an unreadable repository and a quiet week are no longer the same empty
list. The sheet refuses to offer an unreadable PR for labelling and the generator exits
non-zero. See amendment A21.

### Sanity check on the instrument — it reproduces the founding example

Fixture: a base class, a subclass calling `super().validate(req)`, a decorator.
PyCG 0.0.7 output, verbatim:

    "handlers.StripeHandler.validate": [
        "handlers.StripeHandler._check_currency",
        "<builtin>.super"
    ]

`super().validate(req)` resolved to `<builtin>.super`, NOT to
`handlers.BasePaymentHandler.validate`. The base method appears in the graph
with no incoming edge from its subclass. This is DyPyBench's finding that
super() calls are absent from PyCG's graph entirely, confirmed on our own
instrument, and it is the exact example in README.md.

It also means the instrument behaves as the pre-registration assumes: crude, and
crude in the direction that makes a null result conservative.


