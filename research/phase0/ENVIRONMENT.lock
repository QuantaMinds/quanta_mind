## Invocation

PyCG ships no console script -- `uvx pycg` fails with "Package `pycg` does not
provide any executables". It is invoked as a module:

    uv run python -m pycg --package <pkg_dir> <files...>

PHASE0_RUNBOOK.md section 3 shows a bare `pycg` CLI call; that form does not
exist and the runbook has been corrected.


