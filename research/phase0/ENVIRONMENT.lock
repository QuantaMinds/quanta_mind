## Corpus facts computed from the live dataset, not cited

Published sources disagree about AIDev-pop's star threshold, so it was computed.
HuggingFace datasets-server `/statistics`, config `repository`, 2,807 rows:

    stars   min 101   median 564   max 203,424

AIDev-pop is >100 stars. arXiv 2606.28125 describes it as ">500"; the dataset card,
the MSR 2026 challenge page and arXiv 2606.13468 say ">100". The median of 564 is
the likely source of that error. See amendment A15.

