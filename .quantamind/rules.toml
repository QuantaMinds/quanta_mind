# The standards this repository holds itself to, checked on every pull request.
#
# These mirror rules already written in AGENTS.md. A rule here that AGENTS.md does not state would
# be a standard nobody agreed to; a rule that fires on deliberate code is worse than no rule at all,
# because it teaches a reviewer to scroll past the section.
#
# Every entry was run against this repository's own history before being added.

[[rule]]
id = "no-research-imports-in-product"
description = "AGENTS.md rule 11: research runs on a different interpreter. pandas in src/ means the product now depends on it, and the container does not have it."
severity = "high"
check = "forbid_import"
target = "pandas"
paths = ["src/", "scripts/"]

[[rule]]
id = "no-scipy-in-product"
description = "AGENTS.md rule 11: scipy belongs to research/, which is a separate uv project. An import here makes it a runtime dependency of the endpoint."
severity = "high"
check = "forbid_import"
target = "scipy"
paths = ["src/", "scripts/"]

[[rule]]
id = "no-yaml-in-product"
description = "AGENTS.md rule 11 names pyyaml specifically. Configuration in this product is TOML, which is stdlib and needs no dependency."
severity = "high"
check = "forbid_import"
target = "yaml"
paths = ["src/", "scripts/"]

[[rule]]
id = "no-eval"
description = "eval turns data into code. Nothing in this product needs it, and a review is a bad place to find out something did."
severity = "high"
check = "forbid_call"
target = "eval"
paths = ["src/", "scripts/"]

# **A model-judged rule was drafted here and WITHDRAWN on its own measurement.** D1c built the
# capability to check a standard no parser can decide, and the first candidate was AGENTS.md rule
# 14 -- "a comment may explain WHY, never assert WHETHER". Run over 12 real files from this
# repository before adding it, the judge called **10 of 12 BROKEN**. Several were fair by the
# rule's letter (`ingest/diff.py`'s "reaching here means the request succeeded" is exactly the
# pattern rule 14 names), but a section that fires on 83% of files teaches a reviewer to scroll
# past it, which the header above says is worse than no rule.
#
# **The capability is not the problem and the measurement says so.** On a known-answer pair the
# same judge scored 12/12, and a real HTTP 403 came back `undecided` rather than `met`
# (`tests/live/model/test_judged_rule_live.py`). What is missing is a prose rule narrow enough to
# be worth firing. Adding one is a separate change with its own before-adding measurement.
